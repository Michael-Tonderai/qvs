# render.yaml
#
# The deployment, declared as a file rather than clicked into a dashboard.
#
# WHY THIS FILE EXISTS AT ALL. The assignment offers bonus marks for an
# Infrastructure-as-Code implementation, and a deployment that lives only in a web
# console cannot be reviewed, cannot be diffed, and cannot be recreated by anyone but
# the person who clicked it. This file is the same argument D-007 makes for keeping
# the CI pipeline in .github/workflows rather than in a settings page: the definition
# of how the system is built and run is itself part of the assessed repository.
#
# It is read by the platform when the service is created from a blueprint, and it is
# readable by an assessor who has no account and no access.

services:
  - type: web
    name: qvs
    # The image is built from the Dockerfile on the platform's own build
    # infrastructure. Nothing is built locally - D-026, and the reason this project
    # has no Docker installation on the development machine at all.
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt

    # DEPLOYS FROM main, NOT develop. main is protected by D-031 and reachable only
    # through a pull request that passed the required check, so nothing reaches the
    # public URL that has not passed lint, security scan and the full suite. That is
    # what makes this a continuous delivery pipeline rather than an automatic upload:
    # the gate is upstream of the deploy, and the deploy is the consequence of the
    # gate rather than a separate act of faith.
    branch: main
    autoDeploy: true

    # The platform polls this path and takes the instance out of rotation if it stops
    # answering 200. It is the same endpoint tests/test_health.py exercises, which is
    # the whole reason that endpoint was built first.
    healthCheckPath: /health/

    envVars:
      # Production configuration. settings.py defaults DEBUG to on, so a deployment
      # must opt out explicitly - a missing variable can never silently serve a
      # debug-mode site with tracebacks in the browser.
      - key: QVS_DEBUG
        value: "0"

      # REQ-N-002: no secret is committed. generateValue asks the platform to create
      # the value once, at first deploy, and keep it thereafter. It is never in this
      # file, never in the repository, and never in an image layer.
      - key: QVS_SECRET_KEY
        generateValue: true

      # D-003. Generated the same way, and with a consequence worth stating: this key
      # signs every qualification record. If it is ever regenerated, every signature
      # already issued becomes invalid and every existing record verifies as TAMPERED.
      # The platform keeps it stable across deploys, which is what makes that safe.
      - key: QVS_SIGNING_KEY
        generateValue: true

      # D-002. The free instance has no persistent disk, so this path lives on the
      # container filesystem and its contents do not survive a restart or a
      # redeployment. That limitation is real, it is named in REQ-N-003's revised
      # wording, and it belongs in the report's critical evaluation rather than in a
      # footnote nobody reads.
      - key: QVS_DATABASE_PATH
        value: /data/db.sqlite3

      # Two workers, not the Dockerfile's local default of three. 512 MB is the free
      # instance's whole allowance, and three Django processes plus a collectstatic
      # pass is how an out-of-memory kill arrives during a demonstration.
      - key: WEB_CONCURRENCY
        value: "2"

      # ALLOWED_HOSTS and CSRF_TRUSTED_ORIGINS are not set here on purpose.
      # settings.py reads RENDER_EXTERNAL_HOSTNAME, which the platform injects at
      # runtime, so the service is correct on its first boot without anyone knowing
      # its hostname in advance. This variable stays available for a custom domain
      # later; sync: false means the platform will not overwrite a value set by hand.
      - key: QVS_ALLOWED_HOSTS
        sync: false
